name: Deploy ticket-system to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Build frontend
        working-directory: artifacts/ticket-system
        run: pnpm run build
        env:
          VITE_API_URL: https://orion-supportdesk-api.onrender.com
      - name: Create SPA fallback
        run: |
          cp artifacts/ticket-system/dist/index.html artifacts/ticket-system/dist/404.html
          touch artifacts/ticket-system/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/ticket-system/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4