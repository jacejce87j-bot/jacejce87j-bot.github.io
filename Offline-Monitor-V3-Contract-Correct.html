router.post("/api/health-reports/units/:id/ticket", auth, async (req,res) => {
  const healthRecord = await db.health_reports.findUnique(req.params.id);
  if (!healthRecord) return res.status(404).json({error:"Health record not found"});

  // Server-side validation (cannot be bypassed)
  const normalized = validateUnitServer(healthRecord);
  if (!normalized.valid) return res.status(422).json({error: normalized.reason});

  // Resolve organizationId - must be numeric
  const org = await db.organizations.findFirst({
    where: { name: { mode:"insensitive", contains: normalized.orgName } }
  });

  const existing = await db.tickets.findFirst({
    where: {
      reg: normalized.registration,
      status: "open",
      organizationId,
    }
  });

      error: \`Open ticket #\${existing.id} already exists\`,
      ticketId: existing.id
    });
  }

    tags: ["vehicle-offline","health-monitor","automated"],
    client: normalized.orgName,
    reg: normalized.registration,
    deviceId: normalized.deviceId,
  };

    const t = await tx.tickets.create({ data: parsed });
    await tx.health_report_tickets.create({
      data: { health_report_id: healthRecord.id, ticket_id: t.id }
    });
    return t;
  });

  res.status(201).json(ticket);
