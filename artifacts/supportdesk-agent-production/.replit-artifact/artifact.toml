kind = "mobile"
previewPath = "/supportdesk-agent-production/"
title = "SupportDesk Agent Production"
description = "A production-only Expo companion for Orion Tracking support agents to securely view and work assigned SupportDesk tickets against the production workspace."
version = "1.0.0"
id = "artifacts/supportdesk-agent-production"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/supportdesk-agent-production/" ]
localPort = 20445

[services.development]
run = "pnpm --filter @workspace/supportdesk-agent-production run dev"

[services.env]
PORT = "20445"
BASE_PATH = "/supportdesk-agent-production/"
PRODUCTION_APP_DOMAIN = "zendesk-salesforce--jacejce87.replit.app"
PRODUCTION_API_DOMAIN = "zendesk-salesforce--jacejce87.replit.app"
