kind = "mobile"
previewPath = "/supportdesk-mobile/"
title = "SupportDesk Mobile"
description = "A focused mobile companion for SupportDesk agents to view assigned tickets, create and update tickets, resolve work, and manage ticket attachments for their signed-in account."
version = "1.0.0"
id = "artifacts/supportdesk-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/supportdesk-mobile/" ]
localPort = 19945

[services.development]
run = "pnpm --filter @workspace/supportdesk-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/supportdesk-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/supportdesk-mobile", "run", "serve" ]

[services.env]
PORT = "19945"
BASE_PATH = "/supportdesk-mobile/"
