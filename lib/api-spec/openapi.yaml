openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ticket Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tickets
    description: Ticket operations
  - name: contacts
    description: Contact operations
  - name: organizations
    description: Organization operations
  - name: agents
    description: Agent operations
  - name: comments
    description: Comment operations
  - name: tags
    description: Tag operations
  - name: dashboard
    description: Dashboard and analytics operations
  - name: Auth
    description: Browser authentication endpoints
  - name: settings
    description: Administrative settings
  - name: storage
    description: Secure file storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── TICKETS ──────────────────────────────────────────────────
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, pending, on_hold, solved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: assigneeId
          in: query
          schema:
            type: ["integer", "null"]
        - name: organizationId
          in: query
          schema:
            type: ["integer", "null"]
        - name: contactId
          in: query
          schema:
            type: ["integer", "null"]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, priority, dueAt]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Not found
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a secure upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /tickets/{id}/merge:
    post:
      operationId: mergeTicket
      tags: [tickets]
      summary: Merge a ticket into another ticket
      description: Moves all comments and activity from the source ticket into the target ticket, then closes the source ticket.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketMergeInput"
      responses:
        "200":
          description: The target ticket after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Bad request (same ticket, already merged, etc.)
        "404":
          description: Ticket not found

  /tickets/{id}/comments:
    get:
      operationId: listTicketComments
      tags: [comments]
      summary: List comments for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createTicketComment
      tags: [comments]
      summary: Add a comment to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ─── CONTACTS ─────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: ["integer", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Contact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPage"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contacts/{id}/tickets:
    get:
      operationId: listContactTickets
      tags: [contacts]
      summary: List tickets for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  # ─── ORGANIZATIONS ────────────────────────────────────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Delete an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── AGENTS ───────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  # ─── TAGS ─────────────────────────────────────────────────────
  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List all tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"

  # ─── DASHBOARD ────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /dashboard/ticket-volume:
    get:
      operationId: getTicketVolume
      tags: [dashboard]
      summary: Ticket volume over last 14 days
      responses:
        "200":
          description: Daily counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCount"

  /dashboard/agent-workload:
    get:
      operationId: getAgentWorkload
      tags: [dashboard]
      summary: Open ticket count per agent
      responses:
        "200":
          description: Agent workload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentWorkload"

  /dashboard/sla-health:
    get:
      operationId: getSlaHealth
      tags: [dashboard]
      summary: SLA breach summary
      responses:
        "200":
          description: SLA health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaHealth"

  /settings/sla-policies:
    get:
      operationId: listSlaPolicies
      tags: [settings]
      summary: List SLA policies
      responses:
        "200":
          description: SLA policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaPolicy"
    post:
      operationId: createSlaPolicy
      tags: [settings]
      summary: Create an SLA policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlaPolicyInput"
      responses:
        "201":
          description: Created SLA policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaPolicy"

  /settings/sla-policies/{id}:
    patch:
      operationId: updateSlaPolicy
      tags: [settings]
      summary: Update an SLA policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlaPolicyUpdate"
      responses:
        "200":
          description: Updated SLA policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaPolicy"

  /settings/ticket-templates:
    get:
      operationId: listTicketTemplates
      tags: [settings]
      summary: List ticket templates
      responses:
        "200":
          description: Ticket templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketTemplate"
    post:
      operationId: createTicketTemplate
      tags: [settings]
      summary: Create a ticket template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketTemplateInput"
      responses:
        "201":
          description: Created ticket template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTemplate"

  /settings/ticket-templates/{id}:
    patch:
      operationId: updateTicketTemplate
      tags: [settings]
      summary: Update a ticket template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketTemplateUpdate"
      responses:
        "200":
          description: Updated ticket template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTemplate"
    delete:
      operationId: deleteTicketTemplate
      tags: [settings]
      summary: Delete a ticket template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the current authenticated user
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start browser login
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to login provider
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete browser login
      responses:
        "302":
          description: Redirect after login
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Log out
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after logout

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── TICKET ───────────────────────────────────────────────
    Ticket:
      type: object
      required: [id, subject, status, priority, type, channel, createdAt, updatedAt]
      properties:
        id:
          type: integer
        subject:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, pending, on_hold, solved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        type:
          type: string
          enum: [question, incident, problem, task]
        channel:
          type: string
          enum: [email, chat, phone, web, api]
        assigneeId:
          type: ["integer", "null"]
        assignee:
          $ref: "#/components/schemas/Agent"
        requesterId:
          type: ["integer", "null"]
        requester:
          $ref: "#/components/schemas/Contact"
        organizationId:
          type: ["integer", "null"]
        organization:
          $ref: "#/components/schemas/Organization"
        tags:
          type: array
          items:
            type: string
        dueAt:
          type: ["string", "null"]
        firstResponseAt:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
        satisfaction:
          type: ["string", "null"]
          enum: [good, bad, null]
        mergedIntoId:
          type: ["integer", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TicketAttachment"
        commentCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    TicketMergeInput:
      type: object
      required: [targetTicketId]
      properties:
        targetTicketId:
          type: integer
          description: ID of the ticket to merge this ticket into

    TicketInput:
      type: object
      required: [subject, status, priority, type, channel]
      properties:
        subject:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, pending, on_hold, solved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        type:
          type: string
          enum: [question, incident, problem, task]
        channel:
          type: string
          enum: [email, chat, phone, web, api]
        assigneeId:
          type: ["integer", "null"]
        requesterId:
          type: ["integer", "null"]
        organizationId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: string
        dueAt:
          type: ["string", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TicketAttachment"

    TicketUpdate:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [open, pending, on_hold, solved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        type:
          type: string
          enum: [question, incident, problem, task]
        channel:
          type: string
          enum: [email, chat, phone, web, api]
        assigneeId:
          type: ["integer", "null"]
        requesterId:
          type: ["integer", "null"]
        organizationId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: string
        dueAt:
          type: ["string", "null"]
        satisfaction:
          type: ["string", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TicketAttachment"

    TicketAttachment:
      type: object
      required: [name, size, contentType, objectPath, uploadedAt]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
        objectPath:
          type: string
        uploadedAt:
          type: string

    TicketTemplate:
      type: object
      required: [id, name, description, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    TicketTemplateInput:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        isActive:
          type: boolean

    TicketTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        isActive:
          type: boolean

    TicketPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── CONTACT ──────────────────────────────────────────────
    Contact:
      type: object
      required: [id, name, email, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        organizationId:
          type: ["integer", "null"]
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          type: string
          enum: [end_user, agent, admin]
        tags:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        ticketCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ContactInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        organizationId:
          type: ["integer", "null"]
        role:
          type: string
          enum: [end_user, agent, admin]
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    SlaPolicy:
      type: object
      required: [id, name, priority, firstResponseMinutes, resolutionMinutes, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
        firstResponseMinutes:
          type: integer
        resolutionMinutes:
          type: integer
        isActive:
          type: boolean
